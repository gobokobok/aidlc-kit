[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-kit"
version = "0.1.0"
description = "Plain-language AI development lifecycle for Product Managers, backed by Git."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
live = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
aidlc = "aidlc.cli:main"

[tool.setuptools.packages.find]
include = ["aidlc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
