# Generated by `aidlc sync-ci`. Appends to audit/log.jsonl after each merge.
# The workflow pushes to main, so main's protection must let GitHub Actions
# bypass the pull request rule (see the setup docs).
name: AIDLC audit
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: aidlc-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: @@INSTALL@@
      - name: Record changed artifacts
        run: >
          aidlc audit record
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
          --actor "${{ github.actor }}"
          --commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
