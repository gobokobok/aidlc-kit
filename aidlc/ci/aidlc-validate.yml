# Generated by `aidlc sync-ci`. Job name `validate` must be a required check on main.
name: AIDLC validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: @@INSTALL@@
      - name: Artifacts are valid
        run: aidlc validate
      - name: CODEOWNERS matches aidlc.yaml
        run: aidlc sync-codeowners --check
      - name: Audit log is append-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            aidlc audit check --base "origin/${{ github.base_ref }}" --frozen
          else
            aidlc audit check --base "${{ github.event.before }}"
          fi
