# AIDLC Kit configuration: the single source of truth for who reviews what.
# Written by `aidlc init`. Replace the example people below with your team's
# GitHub usernames, then run `aidlc validate` to check this file.

display_name: AIDLC Kit

# Who is in which role (GitHub usernames).
people:
  alice: [pm]
  dana: [pm]              # a second PM, so discovery can get a PM peer approval
  bob: [ops_reviewer]
  priya: [tech_reviewer, kit_admin]   # kit_admin: owns aidlc.yaml and .github/
  sam: [risk_reviewer]
  lee: [data_owner]       # needed by Tier 3 features
  jonas: [engineer]

# Which roles must approve which artifact type. `pm_peer` means any person
# with role `pm` other than the author. Types not listed need one approval
# from anyone other than the author.
review_routing:
  discovery:    [pm_peer]
  requirement:  [ops_reviewer, tech_reviewer]
  criteria:     [ops_reviewer, tech_reviewer]
  asset:        [tech_reviewer]
  risk:         [risk_reviewer]
  handoff:      [tech_reviewer]

# What each risk tier adds on top of the routing above.
risk_tiers:
  T1: {label: Low,    extra_reviewers: [],                          required_artifacts: [],                   min_thresholds: {},               human_in_loop: false}
  T2: {label: Medium, extra_reviewers: [risk_reviewer],             required_artifacts: [],                   min_thresholds: {accuracy: 0.85}, human_in_loop: false}
  T3: {label: High,   extra_reviewers: [risk_reviewer, data_owner], required_artifacts: [privacy_assessment], min_thresholds: {accuracy: 0.95}, human_in_loop: true}

# Defaults for criteria that do not set their own thresholds.
thresholds:
  accuracy: 0.90
  max_unsafe: 0

# Live evals (optional). CI only ever uses saved answers, so no key is needed
# there. Uncomment and fill in to let `/eval --live` call a model:
# eval:
#   provider: <provider name: see the setup docs>
#   model: <model ID>
#   api_key_env: <environment variable holding the API key>
#   base_url: <only for a self-hosted or gateway endpoint>
