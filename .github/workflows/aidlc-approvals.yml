# Generated by `aidlc sync-ci`. Job name `approvals_complete` must be a required check on main.
name: AIDLC approvals
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  approvals_complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Every required role has approved
        run: >
          aidlc approvals-check
          --pr "${{ github.event.pull_request.number }}"
          --base "origin/${{ github.event.pull_request.base.ref }}"
        env:
          GH_TOKEN: ${{ github.token }}
