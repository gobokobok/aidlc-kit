# Generated by `aidlc sync-ci`. Job name `eval` must be a required check on main.
# Runs from saved model answers only: no API key, no cost, same result every time.
name: AIDLC eval
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Golden sets pass from saved answers
        run: aidlc eval --check --all
