# Generated by `aidlc sync-ci`. Appends to audit/log.jsonl after each merge.
# The workflow pushes to main, so main's protection must let it bypass the pull
# request rule. In an organisation, add GitHub Actions as a bypass actor. In a
# personal repository GitHub does not allow that: add a deploy key with write
# access as the bypass actor and store its private key as the repository secret
# AIDLC_AUDIT_KEY. Without that secret the job pushes as GitHub Actions.
name: AIDLC audit
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: aidlc-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.AIDLC_AUDIT_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Record changed artifacts
        run: >
          aidlc audit record
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
          --actor "${{ github.actor }}"
          --commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
